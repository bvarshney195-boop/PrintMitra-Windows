name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: src/PrintMitra/PrintMitra.csproj
      - name: Restore
        run: dotnet restore PrintMitra.sln
      - name: Build
        run: dotnet build PrintMitra.sln -c Release --no-restore
      - name: Publish self-contained Windows x64
        run: dotnet publish src/PrintMitra/PrintMitra.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish/win-x64
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: PrintMitra-Windows-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error
          retention-days: 14
